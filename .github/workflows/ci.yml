name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit, so a moved tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
